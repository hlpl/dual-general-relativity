[build-system]
requires=["setuptools>=61","wheel"]
build-backend="setuptools.build_meta"
[project]
name="dual-general-relativity"
version = "2.0.2"
readme = "README.md"
description = "Dual General Relativity calculator: two metrics, one manifold — companion metric, Einstein checks, 32 presets. Local use only."
requires-python=">=3.9"
dependencies=["sympy","flask","numpy"]
[project.scripts]
dual-general-relativity="dual_general_relativity.server:main"
[tool.setuptools.packages.find]
where=["src"]
