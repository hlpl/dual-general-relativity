[build-system]
requires=["setuptools>=61","wheel"]
build-backend="setuptools.build_meta"
[project]
name="dual-general-relativity"
version = "2.0.0"
description="DGR Calculator"
requires-python=">=3.9"
dependencies=["sympy","flask","numpy"]
[project.scripts]
dual-general-relativity="dual_general_relativity.server:main"
[tool.setuptools.packages.find]
where=["src"]
